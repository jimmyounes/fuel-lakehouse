# fuel-lakehouse configuration.
# Everything the code needs to know about *where* and *how* lives here, never in the code.
# Phase 3 will swap the local paths for object storage URIs (s3://..., abfss://...) without touching src/.

project: fuel-lakehouse

paths:
  raw: data/raw          # downloaded zip/xml files, as received
  bronze: data/bronze    # Delta, raw rows
  silver: data/silver    # Delta, clean tables
  gold: data/gold        # Delta, business aggregates

source:
  daily_url: https://donnees.roulez-eco.fr/opendata/jour
  instant_url: https://donnees.roulez-eco.fr/opendata/instantane
  yearly_url: https://donnees.roulez-eco.fr/opendata/annee/{year}
  encoding: ISO-8859-1

spark:
  app_name: fuel-lakehouse
  master: local[*]           # all cores of this machine; a cluster URL in Phase 3
  driver_memory: 4g          # the single driver JVM; raise it for the yearly backfill
  shuffle_partitions: 8      # Spark's default is 200, sized for clusters, not for a laptop
  extra_packages:            # Maven coordinates loaded into the JVM at startup, like Delta itself
    - com.databricks:spark-xml_2.12:0.18.0   # XML reader; _2.12 = Scala version of pyspark 3.5
  java_home: /opt/homebrew/opt/openjdk@17   # local convenience only; ignored if JAVA_HOME is already set
  extra_conf:                # any spark.* setting, applied as-is to the session
    # spark-xml mis-parses nested tags when the optimizer hands it a pruned schema
    # (verified 2026-11-15: half the stations lost their prices). Bronze reads everything anyway.
    spark.sql.optimizer.nestedSchemaPruning.enabled: "false"
    # Feed timestamps are French local time with no offset: pin the session so a server in UTC reads them the same.
    spark.sql.session.timeZone: Europe/Paris
    spark.sql.debug.maxToStringFields: "200"   # our nested schema is wide; avoids a noisy truncation warning
    # The feed contains typos such as a shortage starting in year 0216. Parquet refuses to write
    # dates before 1900 unless told which calendar to use. We keep the value as-is and flag it in Silver.
    spark.sql.parquet.datetimeRebaseModeInWrite: CORRECTED
    spark.sql.parquet.int96RebaseModeInWrite: CORRECTED
    spark.sql.parquet.datetimeRebaseModeInRead: CORRECTED
    spark.sql.parquet.int96RebaseModeInRead: CORRECTED

tables:
  bronze_pdv: pdv_raw        # one row per station per source file, nested arrays kept
  silver:
    price_events: price_events          # one row per price update          (insert-only MERGE)
    shortages: shortages                # one row per shortage              (insert + update MERGE)
    closures: closures                  # one row per station closure       (insert + update MERGE)
    stations: stations                  # one row per station, current state (insert + update MERGE)
    station_services: station_services  # station x service, current state  (replaced, forward in time only)
    station_hours: station_hours        # station x weekday x slot, current state
    processed_files: _processed_files   # ledger: which Bronze files Silver has already absorbed

quality:
  # Physically implausible prices are flagged in Silver, never dropped.
  # Statistical outliers (vs the day's distribution) are a Gold concern.
  price_min: 0.2
  price_max: 5.0

logging:
  level: INFO
